<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Everyday Taste</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>Everyday Taste</h1>
  <p class="subtitle">밝고 정돈된 일상의 취향 기록</p>
</header>

<main>

  <div class="filter-buttons">
    <button data-filter="all" class="active">전체</button>
    <button data-filter="music">노래</button>
    <button data-filter="item">물건</button>
    <button data-filter="place">장소</button>
  </div>

  <div class="tag-filters" id="tagFilters"></div>
  <div class="card-grid" id="cardGrid"></div>

</main>

<button id="addButton">+</button>

<!-- 모달 -->
<div id="addModal" class="modal hidden">
  <div class="modal-content">
    <h2 id="modalTitle">취향 추가</h2>

    <select id="typeInput">
      <option value="music">노래</option>
      <option value="item">물건</option>
      <option value="place">장소</option>
    </select>

    <input id="titleInput" placeholder="제목" />
    <input id="descInput" placeholder="설명" />
    <input id="thumbInput" placeholder="썸네일 이미지 URL" />
    <input id="tagsInput" placeholder="태그 (쉼표로 구분)" />

    <button id="saveTaste">저장</button>
  </div>
</div>

<footer>
  <p>© Everyday Taste</p>
</footer>

<script src="script.js"></script>
</body>
</html>
